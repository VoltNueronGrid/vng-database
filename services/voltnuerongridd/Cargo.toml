[package]
name = "voltnuerongridd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
axum = "0.7"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
voltnuerongrid-core = { path = "../../crates/voltnuerongrid-core" }
voltnuerongrid-config = { path = "../../crates/voltnuerongrid-config" }
voltnuerongrid-meta = { path = "../../crates/voltnuerongrid-meta" }
voltnuerongrid-exec-datafusion = { path = "../../crates/voltnuerongrid-exec-datafusion", features = ["datafusion"] }
voltnuerongrid-auth = { path = "../../crates/voltnuerongrid-auth" }
voltnuerongrid-audit = { path = "../../crates/voltnuerongrid-audit" }
voltnuerongrid-ai = { path = "../../crates/voltnuerongrid-ai" }
voltnuerongrid-exec = { path = "../../crates/voltnuerongrid-exec" }
voltnuerongrid-sql = { path = "../../crates/voltnuerongrid-sql" }
voltnuerongrid-store = { path = "../../crates/voltnuerongrid-store", features = ["rocksdb"] }
voltnuerongrid-ingest = { path = "../../crates/voltnuerongrid-ingest" }
voltnuerongrid-opt = { path = "../../crates/voltnuerongrid-opt" }
voltnuerongrid-plugins = { path = "../../crates/voltnuerongrid-plugins" }
voltnuerongrid-mcp = { path = "../../crates/voltnuerongrid-mcp" }
voltnuerongrid-driver-rust = { path = "../../drivers/voltnuerongrid-driver-rust" }
voltnuerongrid-failover = { path = "../../crates/voltnuerongrid-failover" }
tower-http = { version = "0.3", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Observability — Phase 0.4 / 0.5 (OTEL)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# OpenTelemetry: activated when OTEL_EXPORTER_OTLP_ENDPOINT env var is set.
# Uses HTTP+protobuf transport (no gRPC/tonic, lighter build) with reqwest+rustls.
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["trace", "http-proto", "reqwest-rustls"] }
tracing-opentelemetry = "0.28"
# Prometheus exposition without pulling the full `prometheus` crate (which is heavy).
# `metrics` + `metrics-exporter-prometheus` give us a tiny, idiomatic API.
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false, features = ["http-listener"] }

# Gap #7: user accounts, password hashing, session tokens
bcrypt = "0.15"
hmac = "0.12"
# UDF-1: real WASM execution (pure-Rust interpreter, no C/C++ dependencies).
wasmi = "0.36"
# UDF-2: real JavaScript execution (pure-Rust ES2021 engine, no ICU bundle).
boa_engine = { version = "0.19", default-features = false, features = ["annex-b"] }
# PLUG-3: Geospatial R-tree index (pure Rust, no C dependencies).
rstar = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

arrow = { version = "53", default-features = false, features = ["ipc"] }
parquet = { version = "53", default-features = false, features = ["arrow", "snap"] }

[features]
# Q-5 / AR-4: The synthetic-data demo shim (`CALL insert_rows(table, count)`)
# is compiled only under this feature so the production binary carries no demo
# code and the SQL hot path performs no `VNG_DEMO_MODE` env lookup.
demo = []

[dev-dependencies]
arrow-array = { version = "53", default-features = false }
arrow-schema = { version = "53", default-features = false }
rust_xlsxwriter = "0.79"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: voltnuerongrid
spec:
  serviceName: voltnuerongrid-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: voltnuerongrid
  template:
    metadata:
      labels:
        app: voltnuerongrid
    spec:
      containers:
        - name: voltnuerongridd
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            - name: sql
              containerPort: {{ .Values.service.sqlPort }}
            - name: cache
              containerPort: {{ .Values.service.cachePort }}
            - name: gossip
              containerPort: {{ .Values.service.gossipPort }}
          env:
            - name: VNG_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VNG_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminApiKey.secretName }}
                  key: {{ .Values.adminApiKey.secretKey }}
            - name: VNG_CLUSTER_MODE
              value: "multi"
            - name: VNG_HTTP_BIND
              value: "0.0.0.0:{{ .Values.service.httpPort }}"
            - name: VNG_SQL_BIND
              value: "0.0.0.0:{{ .Values.service.sqlPort }}"
            - name: VNG_GOSSIP_BIND
              value: "0.0.0.0:{{ .Values.service.gossipPort }}"
            - name: VNG_DATA_DIR
              value: "/var/lib/voltnuerongrid"
            - name: VNG_CONFIG_FILE
              value: "/etc/voltnuerongrid/config.yaml"
            - name: VNG_SEEDS
              value: "voltnuerongrid-0.voltnuerongrid-headless:{{ .Values.service.gossipPort }},voltnuerongrid-1.voltnuerongrid-headless:{{ .Values.service.gossipPort }},voltnuerongrid-2.voltnuerongrid-headless:{{ .Values.service.gossipPort }}"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/voltnuerongrid
            - name: config
              mountPath: /etc/voltnuerongrid
      volumes:
        - name: config
          configMap:
            name: voltnuerongrid-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}


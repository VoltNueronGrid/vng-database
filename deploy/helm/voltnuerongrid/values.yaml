replicaCount: 3

image:
  repository: ghcr.io/voltnuerongrid/voltnuerongridd
  tag: dev
  pullPolicy: IfNotPresent

# adminApiKey is loaded from a Kubernetes Secret named 'voltnuerongrid-admin'.
# Create it with: kubectl create secret generic voltnuerongrid-admin --from-literal=api-key=<KEY>
adminApiKey:
  secretName: voltnuerongrid-admin
  secretKey: api-key

service:
  type: ClusterIP
  httpPort: 8080
  sqlPort: 5432
  cachePort: 6380
  gossipPort: 7000

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

persistence:
  enabled: true
  size: 20Gi
  storageClassName: ""

# readinessProbe: HTTP GET /health must return 200 before traffic is routed.
readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

# livenessProbe: restart pod if /health fails for 3 consecutive checks.
livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 20
  failureThreshold: 5

env:
  VNG_CLUSTER_MODE: multi
  VNG_HTTP_BIND: 0.0.0.0:8080
  VNG_SQL_BIND: 0.0.0.0:5432
  VNG_GOSSIP_BIND: 0.0.0.0:7000
  VNG_DATA_DIR: /var/lib/voltnuerongrid
  VNG_CONFIG_FILE: /etc/voltnuerongrid/config.yaml
